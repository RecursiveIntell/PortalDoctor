[tool.poetry]
name = "portal-doctor"
version = "0.2.0"
description = "A Linux desktop application that diagnoses and fixes Wayland screen-sharing issues"
authors = ["Portal Doctor Contributors"]
license = "MIT"
readme = "README.md"
packages = [{include = "portal_doctor"}]
keywords = ["wayland", "linux", "screen-sharing", "pipewire", "xdg-portal", "diagnostics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]

[tool.poetry.scripts]
portal-doctor = "portal_doctor.main:main"

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
PySide6 = "^6.6"
dbus-next = {git = "https://github.com/altdesktop/python-dbus-next.git", rev = "ab566e16a71bfc9d7e0d29676aa459ec060e72c5"}

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
pytest-asyncio = "^0.23"
ruff = "^0.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = ["E501"]
